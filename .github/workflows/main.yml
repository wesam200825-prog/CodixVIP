name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and Patch Project
        run: |
          unzip -o CodiX_VIP_Pro_Android_Project.zip
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ "$PROJECT_DIR" != "." ] && [ -n "$PROJECT_DIR" ]; then
            cp -r "$PROJECT_DIR"/* .
          fi

          python3 - << 'EOF'
          import glob, re

          # 1. Patch SecureStore.kt & NativeBridge.kt to allow saving PINs without Android Keyguard/Biometric prompt
          for path in glob.glob("**/SecureStore.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = s.replace(".setUserAuthenticationRequired(true)", ".setUserAuthenticationRequired(false)")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)

          for path in glob.glob("**/NativeBridge.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  nb = f.read()
              nb = re.sub(
                  r'fun isDeviceSecure\(\): Boolean \{[\s\S]*?\}',
                  'fun isDeviceSecure(): Boolean { return true }',
                  nb, count=1
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(nb)

          # 2. Patch app.js for custom per-account 4-digit transfer PIN + recovery via saved bank PIN
          app_js_path = glob.glob("**/www/js/app.js", recursive=True)[0]
          with open(app_js_path, "r", encoding="utf-8") as f:
              js = f.read()

          # A. Replace updatePinState to remove device lock requirement
          old_pin_state = """  function updatePinState() {
    var prov = currentProv(), acc = currentAccount();
    var key = pinKeyFor(prov, acc);
    ui.hasSavedPin = N.available && N.pin.has(key);
    var cb = $('savePinCheckbox');
    cb.checked = ui.hasSavedPin;
    var supported = N.available && N.pin.supported();
    $('savePinWrap').style.display = N.available ? '' : 'none';
    cb.disabled = N.available && !supported;
    var hint = '';
    if (ui.hasSavedPin) hint = 'كلمة السر محفوظة ومشفرة بمفتاح الجهاز. اترك الحقل فارغًا لاستخدامها (تُطلب البصمة).';
    else if (N.available && !supported) hint = 'لحفظ كلمة السر يجب تفعيل قفل شاشة (بصمة أو رمز) على الجهاز.';
    $('pinHint').textContent = hint;
    $('pin').placeholder = ui.hasSavedPin ? 'محفوظة' : '••••';
  }"""

          new_pin_state = """  function updatePinState() {
    var prov = currentProv(), acc = currentAccount();
    var key = pinKeyFor(prov, acc);
    ui.hasSavedPin = N.available ? N.pin.has(key) : !!(acc && acc.savedBankPin);
    var cb = $('savePinCheckbox');
    cb.checked = ui.hasSavedPin;
    $('savePinWrap').style.display = '';
    cb.disabled = false;
    var hint = '';
    if (ui.hasSavedPin) hint = 'كلمة السر محفوظة. اترك الحقل فارغًا لاستخدامها تلقائيًا.';
    if (acc && acc.transferPin) hint += (hint ? ' | ' : '') + '🔒 محمي برمز تحويل خاص.';
    $('pinHint').textContent = hint;
    $('pin').placeholder = ui.hasSavedPin ? 'محفوظة' : '••••';
  }"""
          js = js.replace(old_pin_state, new_pin_state)

          # B. Replace onSavePinToggle to save bank PIN directly without biometric auth
          old_save_toggle = """  async function onSavePinToggle() {
    var cb = $('savePinCheckbox');
    var prov = currentProv(), acc = currentAccount();
    var key = pinKeyFor(prov, acc);
    if (!cb.checked) { N.pin.remove(key); ui.hasSavedPin = false; updatePinState(); toast('تم حذف كلمة السر المحفوظة'); return; }
    var pin = $('pin').value.trim();
    if (!/^\\d{4}$/.test(pin)) { toast('أدخل كلمة السر (4 أرقام) أولًا ثم فعّل الحفظ'); cb.checked = false; return; }
    var a = await N.auth('حفظ كلمة السر', 'سيتم تشفيرها بمفتاح محمي في الجهاز');
    if (!a.ok) { toast('تم إلغاء التحقق، لم تُحفظ كلمة السر'); cb.checked = false; return; }
    var r = N.pin.save(key, pin);
    if (r.ok) { $('pin').value = ''; ui.hasSavedPin = true; toast('تم حفظ كلمة السر مشفرة'); }
    else {
      cb.checked = false;
      toast(r.reason === 'no_lock' ? 'فعّل قفل شاشة على الجهاز أولًا' : 'تعذر حفظ كلمة السر بأمان على هذا الجهاز');
    }
    updatePinState(); updateCode();
  }"""

          new_save_toggle = """  async function onSavePinToggle() {
    var cb = $('savePinCheckbox');
    var prov = currentProv(), acc = currentAccount();
    var key = pinKeyFor(prov, acc);
    if (!cb.checked) {
      if (N.available) N.pin.remove(key);
      if (acc) { delete acc.savedBankPin; S.save(); }
      ui.hasSavedPin = false;
      updatePinState();
      toast('تم حذف كلمة السر المحفوظة');
      return;
    }
    var pin = $('pin').value.trim();
    if (!/^\\d{4}$/.test(pin)) { toast('أدخل كلمة السر (4 أرقام) أولًا ثم فعّل الحفظ'); cb.checked = false; return; }
    var savedOk = false;
    if (N.available) {
      var r = N.pin.save(key, pin);
      savedOk = !!r.ok;
    }
    if (!savedOk && acc) {
      acc.savedBankPin = pin;
      S.save();
      savedOk = true;
    } else if (savedOk && acc) {
      acc.savedBankPin = pin;
      S.save();
    }
    if (savedOk || !N.available) {
      $('pin').value = '';
      ui.hasSavedPin = true;
      toast('تم حفظ كلمة سر الحساب بنجاح ✅');
    } else {
      cb.checked = false;
      toast('تعذر حفظ كلمة السر');
    }
    updatePinState(); updateCode();
  }"""
          js = js.replace(old_save_toggle, new_save_toggle)

          # C. Add helper functions for custom 4-digit transfer PIN verification & recovery
          helper_code = """
  function getStoredBankPin(prov, acc) {
    var key = pinKeyFor(prov, acc);
    if (N.available) {
      var r = N.pin.get(key);
      if (r && r.ok && r.pin) return r.pin;
    }
    return (acc && acc.savedBankPin) ? acc.savedBankPin : '';
  }

  function verifyCustomTransferPin(prov, acc, typedBankPin) {
    return new Promise(function (resolve) {
      if (!acc || !acc.transferPin) { resolve(true); return; }
      var done = false;
      function fin(v) { if (done) return; done = true; closeSheet(); resolve(v); }

      function showPinPrompt() {
        openSheet(function () {
          var inp = h('input', {
            class: 'field', type: 'password', inputmode: 'numeric', maxlength: '4',
            placeholder: '••••', style: 'text-align:center;font-size:22px;letter-spacing:8px'
          });
          var err = h('div', { class: 'err-text' });
          inp.addEventListener('input', function () {
            inp.value = inp.value.replace(/\\D/g, '').slice(0, 4);
            err.textContent = '';
          });

          var root = h('div', {},
            h('h2', { text: '🔒 تأكيد رمز التحويل' }),
            h('p', { text: 'أدخل رمز التحويل الخاص بحساب "' + accountLabel(acc) + '" (4 أرقام):' }),
            inp,
            err,
            h('div', { class: 'btn-row' },
              h('button', { class: 'btn', text: 'تأكيد التحويل', onclick: function () {
                if (inp.value === acc.transferPin) { fin(true); }
                else { err.textContent = 'رمز التحويل غير صحيح!'; inp.value = ''; inp.focus(); }
              } }),
              h('button', { class: 'btn sec', text: 'إلغاء', onclick: function () { fin(false); } })
            ),
            h('div', { style: 'margin-top:12px;text-align:center' },
              h('button', {
                class: 'btn small sec',
                text: 'نسيت رمز التحويل؟ استعادة بكلمة مرور الحساب',
                onclick: function () { showRecoveryPrompt(); }
              })
            )
          );
          setTimeout(function () { inp.focus(); }, 100);
          return root;
        });
      }

      function showRecoveryPrompt() {
        var realBankPin = getStoredBankPin(prov, acc) || typedBankPin;
        openSheet(function () {
          var bankInp = h('input', {
            class: 'field', type: 'password', inputmode: 'numeric', maxlength: '4',
            placeholder: 'كلمة مرور الحساب البنكي (4 أرقام)', style: 'text-align:center;font-size:18px;letter-spacing:4px'
          });
          var newPinInp = h('input', {
            class: 'field', type: 'password', inputmode: 'numeric', maxlength: '4',
            placeholder: 'رمز التحويل الجديد (أو اتركه فارغًا لإلغاء القفل)', style: 'text-align:center;font-size:18px;letter-spacing:4px'
          });
          var err = h('div', { class: 'err-text' });
          bankInp.addEventListener('input', function () { bankInp.value = bankInp.value.replace(/\\D/g, '').slice(0, 4); });
          newPinInp.addEventListener('input', function () { newPinInp.value = newPinInp.value.replace(/\\D/g, '').slice(0, 4); });

          return h('div', {},
            h('h2', { text: '🔑 استعادة رمز التحويل' }),
            h('p', { text: realBankPin
              ? 'أدخل كلمة مرور الحساب البنكي المحفوظة للتحقق من ملكيتك وتعيين رمز تحويل جديد:'
              : 'لا توجد كلمة مرور بنكية محفوظة لهذا الحساب. احفظ كلمة مرور الحساب في الرئيسية أولًا لتتمكن من الاستعادة.' }),
            realBankPin ? h('div', {},
              h('label', { class: 'f', text: 'كلمة مرور الحساب البنكي (مفتاح الاستعادة)' }),
              bankInp,
              h('label', { class: 'f', text: 'رمز التحويل الجديد (4 أرقام - اختياري)' }),
              newPinInp,
              err,
              h('div', { class: 'btn-row' },
                h('button', { class: 'btn', text: 'تحديث الرمز والمتابعة', onclick: function () {
                  if (bankInp.value !== realBankPin) {
                    err.textContent = 'كلمة مرور الحساب البنكي غير صحيحة!';
                    return;
                  }
                  if (newPinInp.value && !/^\\d{4}$/.test(newPinInp.value)) {
                    err.textContent = 'رمز التحويل الجديد يجب أن يكون 4 أرقام أو فارغًا لإلغائه';
يُرجى استخدام الرمز البرمجي بحذر.
return;
}
acc.transferPin = newPinInp.value || '';
S.save();
toast(acc.transferPin ? 'تم تحديث رمز التحويل بنجاح ✅' : 'تم إلغاء رمز التحويل بنجاح ✅');
fin(true);
} }),
h('button', { class: 'btn sec', text: 'رجوع', onclick: showPinPrompt })
)
) : h('div', { class: 'btn-row' },
h('button', { class: 'btn sec', text: 'رجوع', onclick: showPinPrompt })
)
);
});
}
showPinPrompt();
});
}
"""
js = js.replace("  // ---------- تنفيذ التحويل ----------", helper_code + "\n  // ---------- تنفيذ التحويل ----------")
# D. Replace device biometric auth in startTransfer with custom transfer PIN check
old_transfer_auth = """    var usingSaved = prov.needsPin && !f.pin;
var pin = f.pin;
if (N.available && (S.d.settings.requireAuth || usingSaved)) {
var a = await N.auth(prov.kind === 'login' ? 'تأكيد الدخول' : 'تأكيد التحويل', prov.kind === 'login' ? prov.label : (money(parseFloat(f.amount)) + ' إلى ' + f.phone));
if (!a.ok && a.reason !== 'no_lock') { toast('تم إلغاء التحقق، لم تُنفَّذ العملية'); return; }
if (a.reason === 'no_lock') {
if (usingSaved) { toast('جهازك بلا قفل شاشة: أدخل كلمة السر يدويًا'); return; }
toast('تنبيه: جهازك بلا قفل شاشة، لا يمكن التحقق بالبصمة');
}
}
if (usingSaved) {
var r = N.pin.get(pinKeyFor(prov, acc));
if (!r.ok) { toast(r.reason === 'auth_required' ? 'انتهت صلاحية التحقق، أعد المحاولة' : 'تعذر قراءة كلمة السر المحفوظة، أدخلها يدويًا'); updatePinState(); return; }
pin = r.pin;
}"""
new_transfer_auth = """    var usingSaved = prov.needsPin && !f.pin;
var pin = f.pin;
if (usingSaved) {
pin = getStoredBankPin(prov, acc);
if (!pin) { toast('تعذر قراءة كلمة السر المحفوظة، أدخلها يدويًا'); updatePinState(); return; }
}
var customOk = await verifyCustomTransferPin(prov, acc, pin);
if (!customOk) { toast('تم إلغاء التحقق، لم تُنفَّذ العملية'); return; }"""
js = js.replace(old_transfer_auth, new_transfer_auth)
# E. Add optional 4-digit transferPin input inside openAccountSheet
old_acc_sheet_fields = """      var def = h('input', { type: 'checkbox', id: 'accDefault' });
def.checked = acc ? !!acc.isDefault : S.d.accounts.length === 0;"""
new_acc_sheet_fields = """      var tPin = h('input', { class: 'field', type: 'password', inputmode: 'numeric', maxlength: '4', 'aria-label': 'رمز حماية التحويل', placeholder: '4 أرقام (اختياري - اتركه فارغًا بدون قفل)', style: 'direction:ltr;text-align:left' });
tPin.value = acc && acc.transferPin ? acc.transferPin : '';
tPin.addEventListener('input', function () { tPin.value = tPin.value.replace(/\D/g, '').slice(0, 4); });
var def = h('input', { type: 'checkbox', id: 'accDefault' });
def.checked = acc ? !!acc.isDefault : S.d.accounts.length === 0;"""
js = js.replace(old_acc_sheet_fields, new_acc_sheet_fields)
old_acc_sheet_ui = """        h('label', { class: 'f', text: 'الشريحة في هذا الجهاز' }), sim,"""
new_acc_sheet_ui = """        h('label', { class: 'f', text: 'الشريحة في هذا الجهاز' }), sim,
h('label', { class: 'f', text: '🔒 رمز حماية التحويل الخاص بهذا الحساب (4 أرقام - اختياري)' }), tPin,"""
js = js.replace(old_acc_sheet_ui, new_acc_sheet_ui)
old_acc_save = """            var p = cleanPhone(phone.value);
if (p && !validPhone(p)) { err.textContent = 'رقم الخط يجب أن يتكون من 10 أرقام ويبدأ بـ 05'; return; }"""
new_acc_save = """            var p = cleanPhone(phone.value);
if (p && !validPhone(p)) { err.textContent = 'رقم الخط يجب أن يتكون من 10 أرقام ويبدأ بـ 05'; return; }
if (tPin.value && !/^\d{4}$/.test(tPin.value)) { err.textContent = 'رمز حماية التحويل يجب أن يكون 4 أرقام دقيقة أو فارغًا'; return; }"""
js = js.replace(old_acc_save, new_acc_save)
old_acc_assign = """            o.subId = sim.value === '' ? null : parseInt(sim.value, 10);
o.isDefault = def.checked;"""
new_acc_assign = """            o.subId = sim.value === '' ? null : parseInt(sim.value, 10);
o.transferPin = tPin.value || '';
o.isDefault = def.checked;"""
js = js.replace(old_acc_assign, new_acc_assign)
with open(app_js_path, "w", encoding="utf-8") as f:
f.write(js)
EOF
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
- name: Build Debug APK
run: |
if [ -f "./gradlew" ]; then
chmod +x gradlew
./gradlew assembleDebug
else
gradle assembleDebug
fi
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: CodixVIP-APK
path: app/build/outputs/apk/debug/app-debug.apk
